<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práxis - Psicopedagogia</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        p.subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #output {
            margin-top: 24px;
            padding: 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
        }

        #output h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Plataforma Práxis</h1>
        <p class="subtitle">Espaço de Intervenção Psicopedagógica</p>
        
        <form id="praxisForm">
            <div class="form-group">
                <label for="studentName">Nome do Aluno / Atendido</label>
                <input type="text" id="studentName" required placeholder="Digite o nome completo">
            </div>

            <div class="form-group">
                <label for="sessionType">Tipo de Atendimento</label>
                <select id="sessionType">
                    <option value="Avaliação Psicopedagógica">Avaliação Psicopedagógica</option>
                    <option value="Intervenção Cognitiva">Intervenção Cognitiva</option>
                    <option value="Orientação Escolar / Familiar">Orientação Escolar / Familiar</option>
                </select>
            </div>

            <div class="form-group">
                <label for="observations">Observações e Hipóteses</label>
                <textarea id="observations" placeholder="Registre as observações da sessão..."></textarea>
            </div>

            <button type="submit">Salvar Registro</button>
        </form>

        <div id="output">
            <h3>Registro Salvo com Sucesso!</h3>
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        document.getElementById('praxisForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('studentName').value;
            const type = document.getElementById('sessionType').value;
            const obs = document.getElementById('observations').value;

            const resultText = document.getElementById('resultText');
            resultText.innerHTML = `<strong>Aluno:</strong> ${name}<br><strong>Tipo:</strong> ${type}<br><strong>Notas:</strong> ${obs || 'Nenhuma observação registrada.'}`;
            
            document.getElementById('output').style.display = 'block';
            this.reset();
        });
    </script>

</body>
</html>
